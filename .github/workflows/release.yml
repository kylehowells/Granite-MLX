name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS ARM64 release
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GRANITE_MLX_HUB_DIRECTORY: /tmp/granite-mlx-${{ github.run_id }}/model-cache
      GRANITE_MLX_COREML_CACHE_DIRECTORY: /tmp/granite-mlx-${{ github.run_id }}/coreml-cache
      GRANITE_MLX_TEST_CONFIG_PATH: /tmp/granite-mlx-${{ github.run_id }}/config.json
      HOMEBREW_NO_AUTO_UPDATE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m
          test "$(uname -m)" = arm64

      - name: Require a clean semantic-version tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must look like 0.1.0; received $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Cache SwiftPM repositories
        uses: actions/cache@v5
        with:
          path: |
            .build/repositories
            .build/checkouts
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ hashFiles('Package.resolved') }}

      - name: Install ffmpeg fallback
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      - name: Run model-free tests
        run: swift test

      - name: Validate public documentation
        run: Scripts/check_documentation.sh

      - name: Build and package release
        run: Scripts/package_release.sh "$GITHUB_REF_NAME" dist

      - name: Validate packaged release without models
        run: Scripts/test_release_archive.sh "dist/granite-mlx-$GITHUB_REF_NAME-macos-arm64.tar.gz" "$GITHUB_REF_NAME"

      - name: Confirm release job did not download models
        run: |
          if find "$GRANITE_MLX_HUB_DIRECTORY" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "Model-free release job unexpectedly downloaded model data." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/granite-mlx-$GITHUB_REF_NAME-macos-arm64.tar.gz" \
            "dist/granite-mlx-$GITHUB_REF_NAME-macos-arm64.tar.gz.sha256" \
            --verify-tag \
            --title "Granite-MLX $GITHUB_REF_NAME" \
            --generate-notes
